# ===== SERVIDOR =====
server.port=${PORT:8080}

# ===== MYSQL (Producción) =====
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimizado para Tráfico Real)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Settings para Producción (Validación estricta de esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== CASSANDRA (Cluster de Producción) =====
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:muvix_catalog}
spring.cassandra.contact-points=${CASSANDRA_HOSTS}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DATACENTER:datacenter1}
spring.cassandra.schema-action=none

# ===== MOBBEX (Producción Real) =====
mobbex.api-key=${MOBBEX_PROD_API_KEY}
mobbex.access-token=${MOBBEX_PROD_ACCESS_TOKEN}
mobbex.test-mode=false
mobbex.url=[suspicious link removed]
mobbex.webhook-url=${MOBBEX_PROD_WEBHOOK_URL}
mobbex.return-url=${MOBBEX_PROD_RETURN_URL}

# Scheduler Mobbex (Ejecución cada hora en producción)
mobbex.escrow.auto-release-cron=0 0 * * * *

# ===== LOGGING (Producción) =====
logging.level.com.muvix=INFO
logging.level.org.springframework.web=WARN