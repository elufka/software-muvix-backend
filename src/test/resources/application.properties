spring.cassandra.local-datacenter=datacenter1
muvix.security.jwt.secret=test-only-signing-key-with-at-least-32-bytes
mobbex.url=https://example.invalid
mobbex.api-key=test-only
mobbex.access-token=test-only
mobbex.test-mode=true
muvix.escrow.auto-release.enabled=false
